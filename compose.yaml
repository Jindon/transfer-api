services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: dev
      APP_SECRET: ${APP_SECRET:-b3f4e2a1c9d8e7f6a5b4c3d2e1f0a9b8}
      DATABASE_URL: "mysql://${DB_USER:-app}:${DB_PASSWORD:-app}@database:3306/${DB_NAME:-transfer_app}?serverVersion=8.0&charset=utf8mb4"
      REDIS_URL: "redis://redis:6379"
      MESSENGER_TRANSPORT_DSN: "redis://redis:6379/transfer_events"
      API_KEY: ${API_KEY:-super_secure_api_key}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-transfer_app}
      MYSQL_USER: ${DB_USER:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-app}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - database_data:/var/lib/mysql:rw

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5

volumes:
  database_data:
